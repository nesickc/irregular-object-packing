name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "releases/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-windows:
    name: C++ / Windows / Visual Studio 2026
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select the hosted Visual Studio 2026 toolchain
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "The runner did not publish VCPKG_INSTALLATION_ROOT."
          }

          $vcpkgExecutable = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkgExecutable -PathType Leaf)) {
            throw "The runner vcpkg executable was not found at $vcpkgExecutable."
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) {
            throw "Visual Studio with the x64 C++ toolset was not found."
          }

          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VS_INSTALL_PATH=$vsInstall" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          cmake --version
          & $vcpkgExecutable version

      - name: Restore vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vs2026-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'thirdparty/vcpkg-ports/**') }}

      - name: Configure the supported Windows preset
        shell: pwsh
        run: ./scripts/configure-windows-ci.ps1

      - name: Verify C++ formatting
        shell: pwsh
        run: >-
          cmake --build --preset windows-vs2026-release
          --target irop-format-check

      - name: Build Release
        shell: pwsh
        run: cmake --build --preset windows-vs2026-release --parallel 2

      - name: Test Release
        shell: pwsh
        run: ctest --preset windows-vs2026-release

      - name: Audit exact dependency notices
        shell: pwsh
        run: >-
          ./scripts/audit-third-party-notices.ps1
          -InstalledRoot build/windows-vs2026/vcpkg_installed
          -BundleOutput build/release-notices

      - name: Configure, analyze, and test with Ninja
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cmake --preset windows-ninja-analysis
          if errorlevel 1 exit /b %errorlevel%
          cmake --build --preset windows-ninja-analysis --parallel 2
          if errorlevel 1 exit /b %errorlevel%
          ctest --preset windows-ninja-analysis
          if errorlevel 1 exit /b %errorlevel%

  ruff-lint:
    name: Python source lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install ruff==0.12.12
      - name: Lint with Ruff
        run: >-
          ruff check --output-format=github --target-version=py39
          --exclude "*.ipynb" irregular_object_packing

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Python test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/python/requirements-ci.txt
          python -m pip install -e . --no-deps

      - name: Test the Python reference package
        run: >-
          pytest --junitxml=junit/test-results.xml --cov=irregular_object_packing --cov-report=xml --cov-report=html

  python-parity:
    name: Python 3.10 reference parity oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Install the pinned parity environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/parity/requirements.txt
          python -m pip install -e . --no-deps
      - name: Verify the Python parity reference corpus
        run: python tests/parity/verify_python_reference.py

  build-package:
    name: Python package build (validation only)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0
      - name: Build package
        run: python -m build
